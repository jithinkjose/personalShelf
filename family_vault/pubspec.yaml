name: family_vault
description: Family Vault - Secure personal document organizer with encrypted local storage.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3
  flutter_secure_storage: ^9.0.0

  # File handling
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  open_filex: ^4.5.0
  share_plus: ^10.0.0

  # Image & PDF
  flutter_pdfview: ^1.3.2
  photo_view: ^0.15.0
  cached_network_image: ^3.4.1

  # State management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.3
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  intl: ^0.19.0

  # Utils
  path: ^1.9.0
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  mime: ^1.0.6
  bcrypt: ^1.1.3
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  # Custom fonts can be added here once downloaded:
  # fonts:
  #   - family: SpaceGrotesk
  #     fonts:
  #       - asset: assets/fonts/SpaceGrotesk-Regular.ttf
  #       - asset: assets/fonts/SpaceGrotesk-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/SpaceGrotesk-Bold.ttf
  #         weight: 700
